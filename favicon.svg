<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="7" fill="#0a0c10"/>
  <!-- Lime top accent bar -->
  <rect x="5" y="5" width="22" height="3.5" rx="1.75" fill="#b8ff2e"/>
  <!-- Calculator button grid: 3x2 -->
  <rect x="5"  y="12" width="6" height="5" rx="1.2" fill="#1d2530"/>
  <rect x="13" y="12" width="6" height="5" rx="1.2" fill="#1d2530"/>
  <rect x="21" y="12" width="6" height="5" rx="1.2" fill="#1d2530"/>
  <rect x="5"  y="20" width="6" height="7" rx="1.2" fill="#1d2530"/>
  <rect x="13" y="20" width="6" height="7" rx="1.2" fill="#1d2530"/>
  <!-- Lime "=" button bottom-right — the brand signature -->
  <rect x="21" y="20" width="6" height="7" rx="1.2" fill="#b8ff2e"/>
  <rect x="23" y="22.5" width="2" height="1" rx=".5" fill="#0a0c10"/>
  <rect x="23" y="24.5" width="2" height="1" rx=".5" fill="#0a0c10"/>
</svg>
